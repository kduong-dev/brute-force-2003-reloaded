[package]
name = "bf_viewer"
version = "0.1.0"
edition = "2021"
description = "Brute Force viewers and playable demo from the original game archives (bf_viewer, bf_play, bf_level) or exported .glb (glb_viewer)"
# `cargo run` opens the character viewer; src/bin/play_*.rs are modules of bf_play, not programs
default-run = "bf_viewer"
autobins = false

[dependencies]
# Pinned: Bevy changes its API every release; upgrade deliberately.
# pbr_specular_textures: skin alpha is a specular mask (KHR_materials_specular style)
# jpeg: the menu background frames (../decompiled/movies/menuBack, from menuBack.bik)
bevy = { version = "0.16.1", features = ["pbr_specular_textures", "wav", "jpeg"] }
flate2 = "1"
tar = "0.4"

# Bevy is very slow unoptimised; optimise dependencies even in debug builds,
# and our own crate moderately.
[profile.dev]
# our decoders parse ~10 MB of BXML at startup; keep them reasonably fast in debug builds
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[[bin]]
name = "bf_viewer"
path = "src/main.rs"

[[bin]]
name = "bf_play"
path = "src/bin/play.rs"

[[bin]]
name = "glb_viewer"
path = "src/bin/glb_viewer.rs"

[[bin]]
name = "bf_level"
path = "src/bin/level.rs"
